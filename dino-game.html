<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🕺 Michael Jackson Game - Gustavo Franco</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: #121212;
      color: #e8eaed;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.5s, color 0.5s;
    }

    .wrapper {
      width: 100%;
      max-width: 840px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.3em;
      margin-bottom: 8px;
      color: #f1c40f;
      text-shadow: 0 0 10px rgba(241, 196, 15, 0.4);
    }

    .header p {
      font-size: 0.65em;
      opacity: 0.7;
    }

    #gameCanvas {
      background-color: #1a1a1a;
      border-bottom: 3px solid #f1c40f;
      width: 100%;
      max-width: 800px;
      height: auto;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .controls-hint {
      margin-top: 20px;
      font-size: 0.6em;
      line-height: 1.6;
      text-align: center;
      opacity: 0.8;
    }

    .btn-container {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.7em;
      padding: 12px 24px;
      background-color: #f1c40f;
      color: #121212;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s, background-color 0.2s;
    }

    button:hover {
      background-color: #f39c12;
      transform: scale(1.05);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      transform: none;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="header">
      <h1>🕺 MOONWALKER GAME</h1>
      <p>Desenvolvido por Gustavo Franco</p>
    </div>

    <canvas id="gameCanvas" width="800" height="200"></canvas>

    <div class="btn-container">
      <button id="startBtn" disabled>CARREGANDO...</button>
      <button id="superBtn" disabled>SUPER</button>
    </div>

    <div class="controls-hint">
      <p><strong>Controles:</strong></p>
      <p> Pular: <code>ESPAÇO</code> / <code>SETA CIMA</code> / <code>TOQUE</code></p>
      <p> Agachar / Cair Rápido: <code>SETA BAIXO</code></p>
      <p> Super: <code>E</code> / <code>BOTAO SUPER</code></p>
    </div>
  </div>

  <script>
    // --- SINTETIZADOR DE ÁUDIO ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'jump') {
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'score') {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'hit') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(30, now + 0.25);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'super') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
          osc.frequency.exponentialRampToValueAtTime(110, now + 0.35);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        }
      } catch (e) { }
    }

    // --- CARREGAMENTO DAS IMAGENS DAS ANIMAÇÕES (arquivos locais) ---
    const imgWalk = new Image(); imgWalk.src = 'walk.png'; // 7 frames lado a lado
    const imgJump = new Image(); imgJump.src = 'jump.png'; // 3 frames lado a lado
    const imgDead = new Image(); imgDead.src = 'dead.png';
    const imgDuck = new Image(); imgDuck.src = 'duck.png';
    const imgAk = new Image(); imgAk.src = 'ak.png';
    let akSprite = null;

    // Aguarda todas as imagens carregarem antes de habilitar o jogo
    const assetList = [imgWalk, imgJump, imgDead, imgDuck, imgAk];
    let assetLoaded = 0;
    assetList.forEach(img => {
      img.onload = () => {
        assetLoaded++;
        if (img === imgAk) akSprite = createTransparentWeaponSprite(imgAk);
        if (assetLoaded === assetList.length) {
          const btn = document.getElementById('startBtn');
          btn.disabled = false;
          btn.textContent = 'INICIAR JOGO';
          btn.addEventListener('click', resetAndStart);
        }
      };
      img.onerror = () => {
        console.warn('Erro ao carregar imagem:', img.src);
      };
    });

    function createTransparentWeaponSprite(source) {
      const offscreen = document.createElement('canvas');
      offscreen.width = source.width;
      offscreen.height = source.height;
      const weaponCtx = offscreen.getContext('2d');
      weaponCtx.drawImage(source, 0, 0);

      const imageData = weaponCtx.getImageData(0, 0, offscreen.width, offscreen.height);
      const data = imageData.data;
      for (let i = 0; i < data.length; i += 4) {
        if (data[i] < 12 && data[i + 1] < 12 && data[i + 2] < 12) {
          data[i + 3] = 0;
        }
      }
      weaponCtx.putImageData(imageData, 0, 0);
      return offscreen;
    }

    // Sprites auxiliares para obstáculos (Cacto / Pterodáctilo em Pixel Art)
    const SPRITES_DEF = {
      cactusSmall: [
        "    XX    ", "    XX    ", "  X XX    ", "  X XX  X ", "  X XX  X ",
        "  XXXXXXX ", "    XX    ", "    XX    ", "    XX    ", "    XX    "
      ],
      pterodactyl1: [
        "        XXXX", "       XXXXXX", "      XXXXXXXX", "     XXXXXXXXXX",
        "  XXXXXXXXXXXXXXXX", " XXXXXXXXXXXXXXXXXX", "XXXXXXXXXXXXXXXXXXXX"
      ],
      pterodactyl2: [
        "  XXXXXXXXXXXXXXXXX ", " XXXXXXXXXXXXXXXXXXX", "XXXXXXXXXXXXXXXXXXXX",
        "    XXXXXXXXXXXX", "   XXXXXXXXXXXXXX", "  XXXXXXXXXXXXXXXX"
      ]
    };

    function generateBitmap(matrix, pixelSize = 2, color = '#f1c40f') {
      const height = matrix.length;
      const width = Math.max(...matrix.map(row => row.length));
      const canvas = document.createElement('canvas');
      canvas.width = width * pixelSize;
      canvas.height = height * pixelSize;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = color;
      for (let r = 0; r < height; r++) {
        for (let c = 0; c < matrix[r].length; c++) {
          if (matrix[r][c] === 'X') {
            ctx.fillRect(c * pixelSize, r * pixelSize, pixelSize, pixelSize);
          }
        }
      }
      return canvas;
    }

    const obsSprites = {
      cactusSmall: generateBitmap(SPRITES_DEF.cactusSmall, 2, '#e74c3c'),
      ptero1: generateBitmap(SPRITES_DEF.pterodactyl1, 2, '#e67e22'),
      ptero2: generateBitmap(SPRITES_DEF.pterodactyl2, 2, '#e67e22')
    };

    // --- CONFIGURAÇÕES DE JOGO E CANVAS ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false; // Preserva o estilo pixel art

    const GROUND_Y = 165;
    let gameRunning = false;
    let gameOver = false;
    let gameSpeed = 6;
    let distance = 0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('mj_hi') || '0', 10) || 0;
    let frameCount = 0;
    const SUPER_CHARGE_FRAMES = 420;
    const SUPER_DURATION_FRAMES = 210;
    let superCharge = 0;
    let superActiveFrames = 0;
    let muzzleFlashes = [];

    // --- PERSONAGEM (MICHAEL JACKSON) ---
    const mj = {
      x: 60,
      y: GROUND_Y - 55,
      width: 45,
      height: 55,
      vy: 0,
      gravity: 0.6,
      jumpForce: -11.5,
      isJumping: false,
      isDucking: false,

      reset() {
        this.y = GROUND_Y - 55;
        this.width = 45;
        this.height = 55;
        this.vy = 0;
        this.isJumping = false;
        this.isDucking = false;
      },

      jump() {
        if (!this.isJumping) {
          this.vy = this.jumpForce;
          this.isJumping = true;
          playSound('jump');
        }
      },

      duck(enable) {
        if (this.isJumping && enable) {
          this.vy += 2.5;
        }
        if (!this.isJumping) {
          this.isDucking = enable;
          if (enable) {
            this.height = 35;
            this.y = GROUND_Y - 35;
            this.width = 40;
          } else {
            this.height = 55;
            this.y = GROUND_Y - 55;
            this.width = 45;
          }
        }
      },

      update() {
        if (this.isJumping) {
          this.y += this.vy;
          this.vy += this.gravity;

          const currentHeight = this.isDucking ? 35 : 55;
          if (this.y >= GROUND_Y - currentHeight) {
            this.y = GROUND_Y - currentHeight;
            this.isJumping = false;
            this.vy = 0;
          }
        }
      },

      getBox() {
        return {
          x: this.x + 6,
          y: this.y + 4,
          width: this.width - 12,
          height: this.height - 6
        };
      },

      drawWeapon(ctx) {
        if (!akSprite || gameOver || this.isDucking) return;

        const bob = this.isJumping ? 0 : Math.sin(frameCount / 5) * 1.5;
        const weaponWidth = this.isJumping ? 62 : 66;
        const weaponHeight = weaponWidth * (akSprite.height / akSprite.width);
        const weaponX = this.x + 25;
        const weaponY = this.y + (this.isJumping ? 23 : 27) + bob;

        ctx.save();
        ctx.translate(weaponX, weaponY);
        ctx.rotate(this.isJumping ? -0.08 : 0.03);
        ctx.drawImage(akSprite, 0, -weaponHeight / 2, weaponWidth, weaponHeight);

        if (superActiveFrames > 0 && frameCount % 4 < 2) {
          ctx.fillStyle = '#fff6a3';
          ctx.fillRect(weaponWidth - 2, -5, 14, 4);
          ctx.fillStyle = '#e74c3c';
          ctx.fillRect(weaponWidth + 10, -3, 8, 2);
        }
        ctx.restore();
      },

      draw(ctx, frameCount) {
        if (gameOver) {
          // Exibe pose de caído
          ctx.drawImage(imgDead, this.x - 10, GROUND_Y - 25, 65, 25);
          return;
        }

        if (this.isJumping) {
          // Alterna entre as sub-poses de pulo da Imagem 2
          const jumpFrame = Math.floor(frameCount / 10) % 3;
          const frameWidth = imgJump.width / 3;
          ctx.drawImage(
            imgJump,
            jumpFrame * frameWidth, 0, frameWidth, imgJump.height,
            this.x, this.y, this.width, this.height
          );
          this.drawWeapon(ctx);
        } else if (this.isDucking) {
          // Pose de ajoelhado/agachado (Imagem 4)
          ctx.drawImage(imgDuck, this.x, this.y, this.width, this.height);
        } else {
          // Animação de caminhada/Moonwalk (Imagem 1 com 7 quadros)
          const totalFrames = 7;
          const frameWidth = imgWalk.width / totalFrames;
          const currentFrame = Math.floor(frameCount / 5) % totalFrames;

          ctx.drawImage(
            imgWalk,
            currentFrame * frameWidth, 0, frameWidth, imgWalk.height,
            this.x, this.y, this.width, this.height
          );
          this.drawWeapon(ctx);
        }
      }
    };

    let obstacles = [];

    function spawnObstacle() {
      if (superActiveFrames > 0) return;

      const minGap = 220;
      const lastObs = obstacles[obstacles.length - 1];
      if (lastObs && (canvas.width - lastObs.x) < minGap) return;

      const rand = Math.random();

      if (score > 120 && rand < 0.35) {
        const heights = [GROUND_Y - 32, GROUND_Y - 55, GROUND_Y - 75];
        const chosenY = heights[Math.floor(Math.random() * heights.length)];
        obstacles.push({
          type: 'ptero',
          x: canvas.width,
          y: chosenY,
          width: 40,
          height: 25,
          animFrame: 0
        });
      } else {
        const count = Math.floor(Math.random() * 2) + 1;
        obstacles.push({
          type: 'cactus',
          x: canvas.width,
          y: GROUND_Y - 28,
          width: 20 * count,
          height: 28,
          count: count
        });
      }
    }

    function canUseSuper() {
      return gameRunning && superCharge >= SUPER_CHARGE_FRAMES && superActiveFrames <= 0;
    }

    function useSuper() {
      if (!canUseSuper()) return;

      superCharge = 0;
      superActiveFrames = SUPER_DURATION_FRAMES;
      obstacles = [];
      muzzleFlashes = [];
      playSound('super');
      updateSuperButton();
    }

    function updateSuperButton() {
      const superBtn = document.getElementById('superBtn');
      const percent = Math.min(100, Math.floor((superCharge / SUPER_CHARGE_FRAMES) * 100));

      if (superActiveFrames > 0) {
        superBtn.textContent = 'SUPER!';
        superBtn.disabled = true;
      } else if (percent >= 100) {
        superBtn.textContent = 'SUPER PRONTO';
        superBtn.disabled = !gameRunning;
      } else {
        superBtn.textContent = `SUPER ${percent}%`;
        superBtn.disabled = true;
      }
    }

    function drawSuperShot() {
      if (superActiveFrames <= 0) return;

      const beamY = mj.y + (mj.isJumping ? 23 : 27);
      ctx.save();
      ctx.globalAlpha = 0.65 + Math.sin(frameCount / 2) * 0.2;
      ctx.fillStyle = '#fff6a3';
      ctx.fillRect(mj.x + 92, beamY - 3, canvas.width - mj.x - 92, 3);
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(mj.x + 92, beamY + 1, canvas.width - mj.x - 92, 2);
      ctx.restore();

      if (frameCount % 3 === 0) {
        muzzleFlashes.push({
          x: mj.x + 120,
          y: beamY + Math.random() * 18 - 9,
          life: 14
        });
      }

      muzzleFlashes.forEach(flash => {
        ctx.fillStyle = flash.life > 7 ? '#fff6a3' : '#e74c3c';
        ctx.fillRect(flash.x, flash.y, flash.life, 3);
        flash.x += 10;
        flash.life--;
      });
      muzzleFlashes = muzzleFlashes.filter(flash => flash.life > 0 && flash.x < canvas.width);
    }

    // --- CONTROLES TECLADO E TOQUE ---
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (!gameRunning) {
          if (assetLoaded === assetList.length) resetAndStart();
        } else {
          mj.jump();
        }
      }
      if (e.code === 'KeyE') {
        e.preventDefault();
        useSuper();
      }
      if (e.code === 'ArrowDown') {
        e.preventDefault();
        if (gameRunning) mj.duck(true);
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowDown') {
        if (gameRunning) mj.duck(false);
      }
    });

    canvas.addEventListener('click', () => {
      if (assetLoaded !== assetList.length) return;
      if (!gameRunning) {
        resetAndStart();
      } else {
        mj.jump();
      }
    });

    document.getElementById('superBtn').addEventListener('click', () => {
      useSuper();
      document.getElementById('superBtn').blur();
    });

    // --- LÓGICA PRINCIPAL E LOOP ---
    function resetAndStart() {
      gameRunning = true;
      gameOver = false;
      gameSpeed = 6;
      distance = 0;
      score = 0;
      frameCount = 0;
      superCharge = 0;
      superActiveFrames = 0;
      muzzleFlashes = [];
      obstacles = [];
      mj.reset();
      document.getElementById('startBtn').blur();
      updateSuperButton();
      requestAnimationFrame(gameLoop);
    }

    function checkCollision(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    function gameLoop() {
      if (!gameRunning) return;

      frameCount++;
      distance += gameSpeed * 0.025;
      const newScore = Math.floor(distance);

      if (superActiveFrames > 0) {
        superActiveFrames--;
        obstacles = [];
      } else if (superCharge < SUPER_CHARGE_FRAMES) {
        superCharge++;
      }

      if (frameCount % 10 === 0 || superActiveFrames === SUPER_DURATION_FRAMES - 1) {
        updateSuperButton();
      }

      if (newScore > score) {
        score = newScore;
        if (score > 0 && score % 100 === 0) playSound('score');
      }

      gameSpeed = Math.min(13, 6 + score * 0.005);
      mj.update();

      // Gerencia Obstáculos
      if (frameCount % Math.max(40, Math.floor(90 - gameSpeed * 3)) === 0) {
        spawnObstacle();
      }

      for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        obs.x -= gameSpeed;

        if (obs.type === 'ptero' && frameCount % 12 === 0) {
          obs.animFrame = obs.animFrame === 0 ? 1 : 0;
        }

        const mjBox = mj.getBox();
        const obsBox = {
          x: obs.x + 2,
          y: obs.y + 2,
          width: obs.width - 4,
          height: obs.height - 4
        };

        if (checkCollision(mjBox, obsBox)) {
          triggerGameOver();
          return;
        }
      }

      obstacles = obstacles.filter(obs => obs.x > -100);

      // --- RENDERIZAÇÃO ---
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Linha do Chão
      ctx.strokeStyle = '#f1c40f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();

      // Obstáculos
      obstacles.forEach(obs => {
        if (obs.type === 'ptero') {
          const sprite = obs.animFrame === 0 ? obsSprites.ptero1 : obsSprites.ptero2;
          ctx.drawImage(sprite, obs.x, obs.y);
        } else {
          for (let c = 0; c < obs.count; c++) {
            ctx.drawImage(obsSprites.cactusSmall, obs.x + (c * 20), obs.y);
          }
        }
      });

      // Rajada do super
      drawSuperShot();

      // Michael Jackson
      mj.draw(ctx, frameCount);

      // Placar
      ctx.font = '12px "Press Start 2P"';
      ctx.fillStyle = '#f1c40f';
      const padScore = (num) => String(num).padStart(5, '0');
      ctx.fillText(`HI ${padScore(highScore)}  ${padScore(score)}`, 520, 30);

      const superRatio = superActiveFrames > 0
        ? superActiveFrames / SUPER_DURATION_FRAMES
        : Math.min(1, superCharge / SUPER_CHARGE_FRAMES);
      ctx.fillStyle = '#3a3a3a';
      ctx.fillRect(20, 18, 130, 10);
      ctx.fillStyle = superActiveFrames > 0 ? '#e74c3c' : '#f1c40f';
      ctx.fillRect(20, 18, 130 * superRatio, 10);
      ctx.strokeStyle = '#f1c40f';
      ctx.strokeRect(20, 18, 130, 10);
      ctx.font = '8px "Press Start 2P"';
      ctx.fillStyle = '#e8eaed';
      ctx.fillText(superActiveFrames > 0 ? 'SUPER ATIVO' : 'SUPER', 20, 42);

      requestAnimationFrame(gameLoop);
    }

    function triggerGameOver() {
      gameRunning = false;
      gameOver = true;
      updateSuperButton();
      playSound('hit');

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('mj_hi', highScore);
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Redesenha chão e jogo congelado
      ctx.strokeStyle = '#f1c40f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();

      mj.draw(ctx, frameCount);

      ctx.font = '16px "Press Start 2P"';
      ctx.fillStyle = '#e74c3c';
      ctx.textAlign = 'center';
      ctx.fillText('G A M E   O V E R', canvas.width / 2, 80);

      ctx.font = '10px "Press Start 2P"';
      ctx.fillStyle = '#f1c40f';
      ctx.fillText('PRESSIONE ESPAÇO PARA JOGAR', canvas.width / 2, 115);
      ctx.textAlign = 'left';
    }
  </script>
</body>
</html>
