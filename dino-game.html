<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🦖 Jogo do Dinossauro - Gustavo Franco</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: #f7f7f7;
      color: #535353;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.5s, color 0.5s;
    }

    body.dark-mode {
      background-color: #202124;
      color: #e8eaed;
    }

    .wrapper {
      width: 100%;
      max-width: 840px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.4em;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 0.7em;
      opacity: 0.7;
    }

    #gameCanvas {
      background-color: transparent;
      border-bottom: 2px solid #535353;
      width: 100%;
      max-width: 800px;
      height: auto;
      cursor: pointer;
    }

    body.dark-mode #gameCanvas {
      border-bottom-color: #e8eaed;
    }

    .controls-hint {
      margin-top: 20px;
      font-size: 0.65em;
      line-height: 1.6;
      text-align: center;
      opacity: 0.8;
    }

    .btn-container {
      margin-top: 15px;
    }

    button {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.7em;
      padding: 10px 20px;
      background-color: #535353;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }

    button:hover {
      background-color: #333;
      transform: scale(1.03);
    }

    body.dark-mode button {
      background-color: #e8eaed;
      color: #202124;
    }

    body.dark-mode button:hover {
      background-color: #fff;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="header">
      <h1>🦖 DINOSSAURO GAME</h1>
      <p>Desenvolvido por Gustavo Franco</p>
    </div>

    <canvas id="gameCanvas" width="800" height="200"></canvas>

    <div class="btn-container">
      <button id="startBtn" onclick="resetAndStart()">INICIAR JOGO</button>
    </div>

    <div class="controls-hint">
      <p><strong>Controles:</strong></p>
      <p> Pular: <code>ESPAÇO</code> / <code>SETA CIMA</code> / <code>TOQUE</code></p>
      <p> Agachar / Cair Rápido: <code>SETA BAIXO</code></p>
    </div>
  </div>

  <script>
    // --- SINTETIZADOR DE ÁUDIO (Web Audio API) ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'jump') {
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'score') {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'hit') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(120, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.22);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        }
      } catch (e) { }
    }

    function generateBitmap(matrix, pixelSize = 2, color = '#535353') {
      const height = matrix.length;
      const width = Math.max(...matrix.map(row => row.length));
      const canvas = document.createElement('canvas');
      canvas.width = width * pixelSize;
      canvas.height = height * pixelSize;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = color;
      for (let r = 0; r < height; r++) {
        for (let c = 0; c < matrix[r].length; c++) {
          if (matrix[r][c] === 'X') {
            ctx.fillRect(c * pixelSize, r * pixelSize, pixelSize, pixelSize);
          }
        }
      }
      return canvas;
    }

    // --- CONFIGURAÇÕES DE JOGO E CANVAS ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let spritesLight = {};
    let spritesDark = {};

    function initSprites() {
      for (let key in SPRITES_DEF) {
        spritesLight[key] = generateBitmap(SPRITES_DEF[key], 2, '#535353');
        spritesDark[key] = generateBitmap(SPRITES_DEF[key], 2, '#e8eaed');
      }
    }
    initSprites();

    const GROUND_Y = 170;
    let gameRunning = false;
    let gameOver = false;
    let gameSpeed = 6;
    let distance = 0;
    let score = 0;
    let highScore = localStorage.getItem('dino_hi_score') || 0;
    let frameCount = 0;
    let isNight = false;

    let flashScoreTimer = 0;

    // --- OBJETOS DO JOGO ---
    const dino = {
      x: 50,
      y: GROUND_Y - 48,
      width: 44,
      height: 48,
      vy: 0,
      gravity: 0.6,
      jumpForce: -11.5,
      isJumping: false,
      isDucking: false,
      animFrame: 0,

      reset() {
        this.y = GROUND_Y - 48;
        this.width = 44;
        this.height = 48;
        this.vy = 0;
        this.isJumping = false;
        this.isDucking = false;
      },

      jump() {
        if (!this.isJumping) {
          this.vy = this.jumpForce;
          this.isJumping = true;
          playSound('jump');
        }
      },

      duck(enable) {
        if (this.isJumping && enable) {
          this.vy += 2.5; // Descida rápida no ar
        }
        if (!this.isJumping) {
          this.isDucking = enable;
          if (enable) {
            this.height = 30;
            this.y = GROUND_Y - 30;
            this.width = 58;
          } else {
            this.height = 48;
            this.y = GROUND_Y - 48;
            this.width = 44;
          }
        }
      },

      update() {
        if (this.isJumping) {
          this.y += this.vy;
          this.vy += this.gravity;

          const currentHeight = this.isDucking ? 30 : 48;
          if (this.y >= GROUND_Y - currentHeight) {
            this.y = GROUND_Y - currentHeight;
            this.isJumping = false;
            this.vy = 0;
          }
        }
      },

      getBox() {
        return {
          x: this.x + 4,
          y: this.y + 4,
          width: this.width - 8,
          height: this.height - 6
        };
      }
    };

    let obstacles = [];
    let clouds = [];
    let stars = [];
    let groundTicks = [];

    // Preenche irregularidades do chão
    for (let i = 0; i < 800; i += 15) {
      if (Math.random() > 0.6) {
        groundTicks.push({ x: i, width: Math.random() * 3 + 1 });
      }
    }

    function spawnObstacle() {
      const minGap = 220;
      const lastObs = obstacles[obstacles.length - 1];
      if (lastObs && (canvas.width - lastObs.x) < minGap) return;

      const rand = Math.random();
      let type = 'cactusSmall';

      // Pterodáctilos aparecem a partir dos 150 pontos
      if (score > 150 && rand < 0.3) {
        const heights = [GROUND_Y - 30, GROUND_Y - 52, GROUND_Y - 75];
        const chosenY = heights[Math.floor(Math.random() * heights.length)];
        obstacles.push({
          type: 'pterodactyl',
          x: canvas.width,
          y: chosenY,
          width: 40,
          height: 30,
          animFrame: 0
        });
      } else if (rand < 0.65) {
        const count = Math.floor(Math.random() * 3) + 1;
        obstacles.push({
          type: 'cactusSmall',
          x: canvas.width,
          y: GROUND_Y - 28,
          width: 20 * count,
          height: 28,
          count: count
        });
      } else {
        const count = Math.floor(Math.random() * 2) + 1;
        obstacles.push({
          type: 'cactusLarge',
          x: canvas.width,
          y: GROUND_Y - 34,
          width: 26 * count,
          height: 34,
          count: count
        });
      }
    }

    function spawnCloud() {
      if (clouds.length < 3 && Math.random() < 0.01) {
        clouds.push({
          x: canvas.width,
          y: Math.random() * 60 + 20,
          speed: Math.random() * 0.5 + 0.5
        });
      }
    }

    function initStars() {
      stars = [];
      for (let i = 0; i < 6; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * 80 + 10
        });
      }
    }
    initStars();

    // --- CONTROLES TECLADO E TOQUE ---
    const keys = {};

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (!gameRunning) {
          resetAndStart();
        } else {
          dino.jump();
        }
      }
      if (e.code === 'ArrowDown') {
        e.preventDefault();
        if (gameRunning) dino.duck(true);
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowDown') {
        if (gameRunning) dino.duck(false);
      }
    });

    canvas.addEventListener('click', () => {
      if (!gameRunning) {
        resetAndStart();
      } else {
        dino.jump();
      }
    });

    // --- LÓGICA PRINCIPAL E LOOP ---
    function resetAndStart() {
      gameRunning = true;
      gameOver = false;
      gameSpeed = 6;
      distance = 0;
      score = 0;
      frameCount = 0;
      obstacles = [];
      clouds = [];
      isNight = false;
      document.body.classList.remove('dark-mode');
      dino.reset();
      document.getElementById('startBtn').blur();
      requestAnimationFrame(gameLoop);
    }

    function checkCollision(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    function gameLoop() {
      if (!gameRunning) return;

      frameCount++;
      distance += gameSpeed * 0.025;
      const newScore = Math.floor(distance);

      if (newScore > score) {
        score = newScore;
        // Som e efeito visual a cada 100 pontos
        if (score > 0 && score % 100 === 0) {
          playSound('score');
          flashScoreTimer = 30;
        }
        // Alterna dia/noite a cada 700 pontos
        if (score > 0 && score % 700 === 0 && frameCount % 10 === 0) {
          isNight = !isNight;
          if (isNight) document.body.classList.add('dark-mode');
          else document.body.classList.remove('dark-mode');
        }
      }

      // Aumento gradual da velocidade
      gameSpeed = Math.min(13, 6 + score * 0.005);

      // Atualiza Dinossauro
      dino.update();

      // Gerencia Nuvens
      spawnCloud();
      clouds.forEach(c => c.x -= c.speed);
      clouds = clouds.filter(c => c.x > -60);

      // Gerencia Chão
      groundTicks.forEach(t => {
        t.x -= gameSpeed;
        if (t.x < 0) t.x += canvas.width;
      });

      // Gerencia Obstáculos
      if (frameCount % Math.max(40, Math.floor(90 - gameSpeed * 3)) === 0) {
        spawnObstacle();
      }

      const activeSprites = isNight ? spritesDark : spritesLight;

      // Colisões e atualização de obstáculos
      for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        obs.x -= gameSpeed;

        // Animação do Pterodáctilo
        if (obs.type === 'pterodactyl' && frameCount % 12 === 0) {
          obs.animFrame = obs.animFrame === 0 ? 1 : 0;
        }

        // Checagem de Colisão
        const dinoBox = dino.getBox();
        const obsBox = {
          x: obs.x + 3,
          y: obs.y + 3,
          width: obs.width - 6,
          height: obs.height - 6
        };

        if (checkCollision(dinoBox, obsBox)) {
          triggerGameOver();
          return;
        }
      }

      obstacles = obstacles.filter(obs => obs.x > -100);

      // --- RENDERIZAÇÃO ---
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Lua e Estrelas no Modo Noturno
      if (isNight) {
        ctx.drawImage(activeSprites.moon, 700, 30);
        stars.forEach(s => ctx.drawImage(activeSprites.star, s.x, s.y));
      }

      // Nuvens
      clouds.forEach(c => {
        ctx.fillStyle = isNight ? '#535353' : '#d3d3d3';
        ctx.fillRect(c.x, c.y, 40, 12);
        ctx.fillRect(c.x + 10, c.y - 6, 20, 6);
      });

      // Chão
      ctx.strokeStyle = isNight ? '#e8eaed' : '#535353';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();

      ctx.fillStyle = isNight ? '#e8eaed' : '#535353';
      groundTicks.forEach(t => {
        ctx.fillRect(t.x, GROUND_Y + 4, t.width, 2);
      });

      // Desenha Obstáculos
      obstacles.forEach(obs => {
        if (obs.type === 'pterodactyl') {
          const spriteKey = obs.animFrame === 0 ? 'pterodactyl1' : 'pterodactyl2';
          ctx.drawImage(activeSprites[spriteKey], obs.x, obs.y);
        } else if (obs.type === 'cactusSmall') {
          for (let c = 0; c < obs.count; c++) {
            ctx.drawImage(activeSprites.cactusSmall, obs.x + (c * 20), obs.y);
          }
        } else if (obs.type === 'cactusLarge') {
          for (let c = 0; c < obs.count; c++) {
            ctx.drawImage(activeSprites.cactusLarge, obs.x + (c * 26), obs.y);
          }
        }
      });

      // Desenha Dinossauro
      let dinoSprite = activeSprites.dinoStand;
      if (dino.isJumping) {
        dinoSprite = activeSprites.dinoStand;
      } else if (dino.isDucking) {
        const leg = Math.floor(frameCount / 6) % 2;
        dinoSprite = leg === 0 ? activeSprites.dinoDuck1 : activeSprites.dinoDuck2;
      } else {
        const leg = Math.floor(frameCount / 6) % 2;
        dinoSprite = leg === 0 ? activeSprites.dinoRun1 : activeSprites.dinoRun2;
      }

      ctx.drawImage(dinoSprite, dino.x, dino.y);

      // Placar e Recorde (HI 00000 00000)
      ctx.font = '12px "Press Start 2P"';
      ctx.fillStyle = isNight ? '#e8eaed' : '#535353';

      const padScore = (num) => String(num).padStart(5, '0');
      const hiText = `HI ${padScore(highScore)}  `;
      const currentScoreText = padScore(score);

      ctx.fillText(hiText, 520, 30);

      // Efeito pisca no placar ao atingir centenas
      if (flashScoreTimer > 0) {
        flashScoreTimer--;
        if (Math.floor(flashScoreTimer / 6) % 2 === 0) {
          ctx.fillText(currentScoreText, 700, 30);
        }
      } else {
        ctx.fillText(currentScoreText, 700, 30);
      }

      requestAnimationFrame(gameLoop);
    }

    function triggerGameOver() {
      gameRunning = false;
      gameOver = true;
      playSound('hit');

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('dino_hi_score', highScore);
      }

      const activeSprites = isNight ? spritesDark : spritesLight;

      // Desenha Dino Derrotado
      ctx.fillStyle = isNight ? '#202124' : '#f7f7f7';
      ctx.fillRect(dino.x, dino.y, dino.width, dino.height);
      ctx.drawImage(activeSprites.dinoDead, dino.x, dino.y);

      // Texto de Game Over
      ctx.font = '16px "Press Start 2P"';
      ctx.fillStyle = isNight ? '#e8eaed' : '#535353';
      ctx.textAlign = 'center';
      ctx.fillText('G A M E   O V E R', canvas.width / 2, 90);

      // Ícone de Recomeçar
      ctx.font = '10px "Press Start 2P"';
      ctx.fillText('PRESSIONE ESPAÇO PARA JOGAR', canvas.width / 2, 120);
      ctx.textAlign = 'left';
    }

    // Tela Inicial estática
    function renderInitialState() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#535353';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();

      ctx.drawImage(spritesLight.dinoStand, dino.x, dino.y);

      ctx.font = '12px "Press Start 2P"';
      ctx.fillStyle = '#535353';
      ctx.fillText(`HI ${String(highScore).padStart(5, '0')}  00000`, 520, 30);
    }

    renderInitialState();
  </script>
</body>
</html>
