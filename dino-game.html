<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonwalker Game - Gustavo Franco</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background:
        radial-gradient(circle at 50% 0%, rgba(241, 196, 15, 0.18), transparent 34%),
        linear-gradient(180deg, #0f1720 0%, #111317 52%, #090909 100%);
      color: #e8eaed;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.5s, color 0.5s;
    }

    .wrapper {
      width: 100%;
      max-width: 840px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.3em;
      margin-bottom: 8px;
      color: #f4d35e;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    .header p {
      font-size: 0.65em;
      opacity: 0.7;
    }

    #gameCanvas {
      background-color: #101820;
      border: 2px solid rgba(244, 211, 94, 0.38);
      border-bottom: 4px solid #c89d33;
      border-radius: 14px;
      width: 100%;
      max-width: 800px;
      height: auto;
      cursor: pointer;
      box-shadow:
        0 22px 60px rgba(0,0,0,0.62),
        inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .controls-hint {
      margin-top: 20px;
      font-size: 0.6em;
      line-height: 1.6;
      text-align: center;
      opacity: 0.8;
    }

    .btn-container {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.7em;
      padding: 12px 24px;
      background: linear-gradient(180deg, #f4d35e, #c89d33);
      color: #141414;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s, background-color 0.2s;
    }

    button:hover {
      background: linear-gradient(180deg, #ffe08a, #d7a840);
      transform: scale(1.05);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      transform: none;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="header">
      <h1>MOONWALKER GAME</h1>
      <p>Desenvolvido por Gustavo Franco</p>
    </div>

    <canvas id="gameCanvas" width="800" height="200"></canvas>

    <div class="btn-container">
      <button id="startBtn" disabled>CARREGANDO...</button>
      <button id="superBtn" disabled>SUPER</button>
    </div>

    <div class="controls-hint">
      <p><strong>Controles:</strong></p>
      <p> Pular: <code>ESPAÇO</code> / <code>SETA CIMA</code> / <code>TOQUE</code></p>
      <p> Agachar / Cair rápido: <code>SETA BAIXO</code></p>
      <p> Super: <code>E</code> / <code>BOTÃO SUPER</code></p>
    </div>
  </div>

  <script>
    // --- SINTETIZADOR DE ÁUDIO ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function ensureAudio() {
      if (!AudioCtx) return null;
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function tone(freq, duration, volume = 0.08, type = 'square', endFreq = null, delay = 0) {
      const ctxAudio = ensureAudio();
      if (!ctxAudio) return;

      const start = ctxAudio.currentTime + delay;
      const osc = ctxAudio.createOscillator();
      const gain = ctxAudio.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, start);
      if (endFreq) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, endFreq), start + duration);
      }

      gain.gain.setValueAtTime(0.001, start);
      gain.gain.linearRampToValueAtTime(volume, start + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, start + duration);

      osc.connect(gain);
      gain.connect(ctxAudio.destination);
      osc.start(start);
      osc.stop(start + duration + 0.03);
    }

    function noiseBurst(duration, volume = 0.08, delay = 0) {
      const ctxAudio = ensureAudio();
      if (!ctxAudio) return;

      const sampleCount = Math.max(1, Math.floor(ctxAudio.sampleRate * duration));
      const buffer = ctxAudio.createBuffer(1, sampleCount, ctxAudio.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < sampleCount; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / sampleCount);
      }

      const source = ctxAudio.createBufferSource();
      const gain = ctxAudio.createGain();
      const start = ctxAudio.currentTime + delay;
      source.buffer = buffer;
      gain.gain.setValueAtTime(volume, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
      source.connect(gain);
      gain.connect(ctxAudio.destination);
      source.start(start);
      source.stop(start + duration);
    }

    function playSound(type) {
      try {
        if (type === 'start') {
          tone(330, 0.08, 0.045, 'square', null, 0);
          tone(440, 0.08, 0.045, 'square', null, 0.08);
          tone(660, 0.12, 0.05, 'square', null, 0.16);
        } else if (type === 'jump') {
          tone(220, 0.14, 0.06, 'square', 620);
        } else if (type === 'score') {
          tone(523.25, 0.06, 0.045, 'square', null, 0);
          tone(659.25, 0.06, 0.045, 'square', null, 0.07);
          tone(783.99, 0.08, 0.05, 'square', null, 0.14);
        } else if (type === 'hit') {
          noiseBurst(0.12, 0.055);
          tone(150, 0.28, 0.07, 'sawtooth', 35);
        } else if (type === 'super') {
          noiseBurst(0.22, 0.06);
          tone(180, 0.12, 0.055, 'sawtooth', 520);
          tone(520, 0.2, 0.05, 'square', 130, 0.08);
          tone(880, 0.08, 0.035, 'triangle', null, 0.18);
        }
      } catch (e) { }
    }

    // --- CARREGAMENTO DAS IMAGENS DAS ANIMAÇÕES (arquivos locais) ---
    const imgWalk = new Image(); imgWalk.src = 'walk.png'; // 7 frames lado a lado
    const imgJump = new Image(); imgJump.src = 'jump.png'; // 3 frames lado a lado
    const imgDead = new Image(); imgDead.src = 'dead.png';
    const imgDuck = new Image(); imgDuck.src = 'duck.png';
    const imgAk = new Image(); imgAk.src = 'ak.png';
    const imgAirplane = new Image(); imgAirplane.src = 'airplane.png';
    const imgTower = new Image(); imgTower.src = 'tower.png';
    let akSprite = null;

    // Aguarda todas as imagens carregarem antes de habilitar o jogo
    const assetList = [imgWalk, imgJump, imgDead, imgDuck, imgAk, imgAirplane, imgTower];
    let assetLoaded = 0; // counts successful loads
    let assetTried = 0;  // counts loads + errors
    let assetsReady = false;
    assetList.forEach(img => {
      img.onload = () => {
        assetLoaded++;
        assetTried++;
        if (img === imgAk) akSprite = createTransparentWeaponSprite(imgAk);
        if (assetTried === assetList.length) enableStartIfReady();
      };
      img.onerror = () => {
        assetTried++;
        console.warn('Erro ao carregar imagem:', img.src);
        if (img === imgAk) akSprite = createFallbackWeaponSprite();
        if (assetTried === assetList.length) enableStartIfReady();
      };
    });

    function enableStartIfReady() {
      // mark assetsReady even if some images failed, but log which ones
      assetsReady = true;
      if (!akSprite) {
        if (imgAk.complete && imgAk.naturalWidth > 0) {
          akSprite = createTransparentWeaponSprite(imgAk);
        } else {
          akSprite = createFallbackWeaponSprite();
        }
      }
      const btn = document.getElementById('startBtn');
      btn.disabled = false;
      btn.textContent = 'INICIAR JOGO';
      btn.onclick = resetAndStart;
      if (typeof updateSuperButton === 'function') updateSuperButton();
    }

    // Safety fallback: if loading hangs, enable start after 4 seconds
    setTimeout(() => {
      if (!assetsReady) {
        console.warn('Asset loading timeout — enabling start anyway');
        enableStartIfReady();
      }
    }, 4000);

    function createFallbackWeaponSprite() {
      const fallback = document.createElement('canvas');
      fallback.width = 96;
      fallback.height = 28;
      const gunCtx = fallback.getContext('2d');

      gunCtx.fillStyle = '#111';
      gunCtx.fillRect(4, 10, 76, 8);
      gunCtx.fillRect(70, 8, 20, 5);
      gunCtx.fillRect(18, 18, 12, 7);
      gunCtx.fillRect(45, 18, 10, 9);
      gunCtx.fillStyle = '#5b3926';
      gunCtx.fillRect(0, 13, 22, 9);
      gunCtx.fillRect(56, 9, 18, 9);
      gunCtx.fillStyle = '#c9c9c9';
      gunCtx.fillRect(28, 8, 24, 4);
      gunCtx.fillRect(78, 11, 16, 3);
      return fallback;
    }

    function createTransparentWeaponSprite(source) {
      const offscreen = document.createElement('canvas');
      offscreen.width = source.width;
      offscreen.height = source.height;
      const weaponCtx = offscreen.getContext('2d');
      weaponCtx.drawImage(source, 0, 0);

      const imageData = weaponCtx.getImageData(0, 0, offscreen.width, offscreen.height);
      const data = imageData.data;
      const width = offscreen.width;
      const height = offscreen.height;
      const visited = new Uint8Array(width * height);
      const stack = [];
      const isNearBlack = (x, y) => {
        const index = (y * width + x) * 4;
        return data[index + 3] > 0 && data[index] < 18 && data[index + 1] < 18 && data[index + 2] < 18;
      };
      const queueEdgePixel = (x, y) => {
        const index = y * width + x;
        if (!visited[index] && isNearBlack(x, y)) {
          visited[index] = 1;
          stack.push([x, y]);
        }
      };

      for (let x = 0; x < width; x++) {
        queueEdgePixel(x, 0);
        queueEdgePixel(x, height - 1);
      }
      for (let y = 0; y < height; y++) {
        queueEdgePixel(0, y);
        queueEdgePixel(width - 1, y);
      }

      while (stack.length) {
        const [x, y] = stack.pop();
        const neighbors = [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]];
        neighbors.forEach(([nx, ny]) => {
          if (nx < 0 || ny < 0 || nx >= width || ny >= height) return;
          const index = ny * width + nx;
          if (!visited[index] && isNearBlack(nx, ny)) {
            visited[index] = 1;
            stack.push([nx, ny]);
          }
        });
      }

      for (let i = 0; i < data.length; i += 4) {
        if (visited[i / 4]) {
          data[i + 3] = 0;
        } else if (data[i + 3] > 0) {
          data[i] = Math.min(255, data[i] * 1.35 + 22);
          data[i + 1] = Math.min(255, data[i + 1] * 1.35 + 22);
          data[i + 2] = Math.min(255, data[i + 2] * 1.35 + 22);
        }
      }
      weaponCtx.putImageData(imageData, 0, 0);

      const cropped = cropVisibleCanvas(offscreen, 6);
      return cropped || createFallbackWeaponSprite();
    }

    function cropVisibleCanvas(source, padding = 0) {
      const cropCtx = source.getContext('2d');
      const imageData = cropCtx.getImageData(0, 0, source.width, source.height);
      const data = imageData.data;
      let minX = source.width;
      let minY = source.height;
      let maxX = -1;
      let maxY = -1;

      for (let y = 0; y < source.height; y++) {
        for (let x = 0; x < source.width; x++) {
          const alpha = data[(y * source.width + x) * 4 + 3];
          if (alpha > 0) {
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
          }
        }
      }

      if (maxX < minX || maxY < minY) return null;

      minX = Math.max(0, minX - padding);
      minY = Math.max(0, minY - padding);
      maxX = Math.min(source.width - 1, maxX + padding);
      maxY = Math.min(source.height - 1, maxY + padding);

      const cropped = document.createElement('canvas');
      cropped.width = maxX - minX + 1;
      cropped.height = maxY - minY + 1;
      cropped.getContext('2d').drawImage(
        source,
        minX, minY, cropped.width, cropped.height,
        0, 0, cropped.width, cropped.height
      );
      return cropped;
    }

    // Sprites auxiliares para obstáculos (Cacto / Pterodáctilo em Pixel Art)
    const obsSprites = {
      tower: imgTower,
      airplane1: imgAirplane,
      airplane2: imgAirplane
    };

    // --- CONFIGURAÇÕES DE JOGO E CANVAS ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false; // Preserva o estilo pixel art

    const GROUND_Y = 165;
    const HORIZON_Y = 96;
    const DEBUG_HITBOX_COLOR = 'rgba(35, 255, 151, 0.85)';
    let showHitboxes = false;
    let gameRunning = false;
    let gameOver = false;
    let gameSpeed = 6;
    let distance = 0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('mj_hi') || '0', 10) || 0;
    let frameCount = 0;
    const SUPER_CHARGE_FRAMES = 900;
    const SUPER_DURATION_FRAMES = 210;
    const PLAYER_NORMAL = { width: 50, height: 64 };
    const PLAYER_DUCK = { width: 48, height: 38 };
    const TOWER_SIZE = { width: 34, height: 58 };
    const AIRPLANE_SIZE = { width: 66, height: 26 };
    const WEAPON_WIDTH_RUN = 46;
    const WEAPON_WIDTH_JUMP = 42;
    const HITBOX_INSETS = {
      player: { left: 14, top: 10, right: 12, bottom: 6 },
      playerDuck: { left: 10, top: 8, right: 9, bottom: 4 },
      tower: { left: 0.2, top: 0.08, right: 0.2, bottom: 0.03 },
      airplane: { left: 0.14, top: 0.25, right: 0.16, bottom: 0.26 }
    };
    let superCharge = 0;
    let superActiveFrames = 0;
    let muzzleFlashes = [];
    let smokePuffs = [];
    let shellCasings = [];
    let obstacleDistanceRemaining = 330;

    // --- PERSONAGEM (MICHAEL JACKSON) ---
    const mj = {
      x: 60,
      y: GROUND_Y - PLAYER_NORMAL.height,
      width: PLAYER_NORMAL.width,
      height: PLAYER_NORMAL.height,
      vy: 0,
      gravity: 0.6,
      jumpForce: -11.5,
      isJumping: false,
      isDucking: false,

      reset() {
        this.y = GROUND_Y - PLAYER_NORMAL.height;
        this.width = PLAYER_NORMAL.width;
        this.height = PLAYER_NORMAL.height;
        this.vy = 0;
        this.isJumping = false;
        this.isDucking = false;
      },

      jump() {
        if (!this.isJumping) {
          this.vy = this.jumpForce;
          this.isJumping = true;
          playSound('jump');
        }
      },

      duck(enable) {
        if (this.isJumping && enable) {
          this.vy += 2.5;
        }
        if (!this.isJumping) {
          this.isDucking = enable;
          if (enable) {
            this.height = PLAYER_DUCK.height;
            this.y = GROUND_Y - PLAYER_DUCK.height;
            this.width = PLAYER_DUCK.width;
          } else {
            this.height = PLAYER_NORMAL.height;
            this.y = GROUND_Y - PLAYER_NORMAL.height;
            this.width = PLAYER_NORMAL.width;
          }
        }
      },

      update() {
        if (this.isJumping) {
          this.y += this.vy;
          this.vy += this.gravity;

          const currentHeight = this.isDucking ? PLAYER_DUCK.height : PLAYER_NORMAL.height;
          if (this.y >= GROUND_Y - currentHeight) {
            this.y = GROUND_Y - currentHeight;
            this.isJumping = false;
            this.vy = 0;
          }
        }
      },

      getBox() {
        const inset = this.isDucking ? HITBOX_INSETS.playerDuck : HITBOX_INSETS.player;
        return {
          x: this.x + inset.left,
          y: this.y + inset.top,
          width: this.width - inset.left - inset.right,
          height: this.height - inset.top - inset.bottom
        };
      },

      drawWeapon(ctx) {
        if (!akSprite || gameOver || this.isDucking) return;

        const bob = this.isJumping ? 0 : Math.sin(frameCount / 5) * 1.5;
        const weaponWidth = this.isJumping ? WEAPON_WIDTH_JUMP : WEAPON_WIDTH_RUN;
        const weaponHeight = weaponWidth * (akSprite.height / akSprite.width);
        const weaponX = this.x + 27;
        const weaponY = this.y + (this.isJumping ? 29 : 39) + bob;

        ctx.save();
        const previousSmoothing = ctx.imageSmoothingEnabled;
        ctx.imageSmoothingEnabled = true;
        ctx.translate(weaponX, weaponY);
        ctx.rotate(this.isJumping ? -0.08 : 0.03);
        ctx.globalCompositeOperation = 'source-over';
        ctx.filter = 'brightness(0.92) contrast(1.08) saturate(0.9)';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
        ctx.shadowBlur = 2;
        ctx.shadowOffsetY = 1;
        ctx.drawImage(akSprite, 0, -weaponHeight / 2, weaponWidth, weaponHeight);
        ctx.filter = 'none';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.imageSmoothingEnabled = previousSmoothing;

        if (superActiveFrames > 0 && frameCount % 4 < 2) {
          ctx.fillStyle = '#fff6a3';
          ctx.fillRect(weaponWidth - 1, -3, 8, 2);
          ctx.fillStyle = '#e74c3c';
          ctx.fillRect(weaponWidth + 6, -2, 5, 1);
        }
        ctx.restore();
      },

      draw(ctx, frameCount) {
        if (gameOver) {
          // Exibe pose de caído
          ctx.drawImage(imgDead, this.x - 10, GROUND_Y - 25, 65, 25);
          return;
        }

        if (this.isJumping) {
          // Alterna entre as sub-poses de pulo da Imagem 2
          const jumpFrame = Math.floor(frameCount / 10) % 3;
          const frameWidth = imgJump.width / 3;
          ctx.drawImage(
            imgJump,
            jumpFrame * frameWidth, 0, frameWidth, imgJump.height,
            this.x, this.y, this.width, this.height
          );
          this.drawWeapon(ctx);
        } else if (this.isDucking) {
          // Pose de ajoelhado/agachado (Imagem 4)
          ctx.drawImage(imgDuck, this.x, this.y, this.width, this.height);
        } else {
          // Animação de caminhada/Moonwalk (Imagem 1 com 7 quadros)
          const totalFrames = 7;
          const frameWidth = imgWalk.width / totalFrames;
          const currentFrame = Math.floor(frameCount / 5) % totalFrames;

          ctx.drawImage(
            imgWalk,
            currentFrame * frameWidth, 0, frameWidth, imgWalk.height,
            this.x, this.y, this.width, this.height
          );
          this.drawWeapon(ctx);
        }
      }
    };

    let obstacles = [];

    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    function getNextObstacleGap() {
      const difficulty = Math.min(1, score / 1400);
      const minGap = 255 - difficulty * 25;
      const maxGap = 500 - difficulty * 65;
      return randomBetween(minGap, maxGap);
    }

    function spawnObstacle() {
      if (superActiveFrames > 0) return;

      const airplaneChance = score > 120
        ? Math.min(0.46, 0.28 + score / 5000)
        : 0;

      if (Math.random() < airplaneChance) {
        const chosenY = randomBetween(GROUND_Y - 60, GROUND_Y - 52);
        obstacles.push({
          type: 'airplane',
          x: canvas.width,
          y: chosenY,
          baseY: chosenY,
          phase: Math.random() * Math.PI * 2,
          width: AIRPLANE_SIZE.width,
          height: AIRPLANE_SIZE.height
        });
      } else {
        obstacles.push({
          type: 'tower',
          x: canvas.width,
          y: GROUND_Y - TOWER_SIZE.height,
          width: TOWER_SIZE.width,
          height: TOWER_SIZE.height
        });
      }
    }

    function getInsetBox(rect, inset) {
      const left = inset.left < 1 ? rect.width * inset.left : inset.left;
      const right = inset.right < 1 ? rect.width * inset.right : inset.right;
      const top = inset.top < 1 ? rect.height * inset.top : inset.top;
      const bottom = inset.bottom < 1 ? rect.height * inset.bottom : inset.bottom;
      return {
        x: rect.x + left,
        y: rect.y + top,
        width: Math.max(1, rect.width - left - right),
        height: Math.max(1, rect.height - top - bottom)
      };
    }

    function getObstacleBox(obs) {
      return getInsetBox(obs, HITBOX_INSETS[obs.type]);
    }

    function canUseSuper() {
      return gameRunning && superCharge >= SUPER_CHARGE_FRAMES && superActiveFrames <= 0;
    }

    function useSuper() {
      if (!canUseSuper()) return;

      superCharge = 0;
      superActiveFrames = SUPER_DURATION_FRAMES;
      obstacles = [];
      muzzleFlashes = [];
      smokePuffs = [];
      shellCasings = [];
      playSound('super');
      updateSuperButton();
    }

    function updateSuperButton() {
      const superBtn = document.getElementById('superBtn');
      const percent = Math.min(100, Math.floor((superCharge / SUPER_CHARGE_FRAMES) * 100));

      if (superActiveFrames > 0) {
        superBtn.textContent = 'SUPER!';
        superBtn.disabled = true;
      } else if (percent >= 100) {
        superBtn.textContent = 'SUPER PRONTO';
        superBtn.disabled = !gameRunning;
      } else {
        superBtn.textContent = `SUPER ${percent}%`;
        superBtn.disabled = true;
      }
    }

    function drawSuperShot() {
      if (superActiveFrames <= 0 && muzzleFlashes.length === 0 && smokePuffs.length === 0 && shellCasings.length === 0) return;

      const originX = mj.x + 27 + (mj.isJumping ? WEAPON_WIDTH_JUMP : WEAPON_WIDTH_RUN);
      const originY = mj.y + (mj.isJumping ? 29 : 39);

      if (superActiveFrames > 0 && frameCount % 2 === 0) {
        const spreads = [
          0 + (Math.random() - 0.5) * 0.95,
          Math.PI + (Math.random() - 0.5) * 0.95,
          -Math.PI / 2 + (Math.random() - 0.5) * 1.45,
          -Math.PI / 4 + (Math.random() - 0.5) * 0.7
        ];

        spreads.forEach(angle => {
          const speed = 15 + Math.random() * 14;
          muzzleFlashes.push({
            x: originX + Math.random() * 8 - 4,
            y: originY + Math.random() * 8 - 4,
            dx: Math.cos(angle) * speed,
            dy: Math.sin(angle) * speed,
            length: 18 + Math.random() * 30,
            thickness: 1 + Math.random() * 2,
            life: 10 + Math.floor(Math.random() * 8)
          });
        });

        for (let i = 0; i < 5; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.8 + Math.random() * 2.4;
          smokePuffs.push({
            x: originX + Math.random() * 10 - 5,
            y: originY + Math.random() * 10 - 5,
            dx: Math.cos(angle) * speed,
            dy: Math.sin(angle) * speed - 0.9,
            radius: 2 + Math.random() * 5,
            life: 26 + Math.floor(Math.random() * 20)
          });
        }

        for (let i = 0; i < 3; i++) {
          shellCasings.push({
            x: originX - 8,
            y: originY - 3,
            dx: -3 - Math.random() * 4,
            dy: -4 - Math.random() * 4,
            spin: Math.random() * Math.PI,
            life: 32 + Math.floor(Math.random() * 14)
          });
        }
      }

      if (superActiveFrames > 0) {
        const flashRadius = 22 + Math.random() * 12;
        const gradient = ctx.createRadialGradient(originX, originY, 1, originX, originY, flashRadius);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
        gradient.addColorStop(0.28, 'rgba(255, 223, 97, 0.9)');
        gradient.addColorStop(0.65, 'rgba(231, 76, 60, 0.45)');
        gradient.addColorStop(1, 'rgba(231, 76, 60, 0)');
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(originX, originY, flashRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      muzzleFlashes.forEach(flash => {
        const angle = Math.atan2(flash.dy, flash.dx);
        ctx.save();
        ctx.translate(flash.x, flash.y);
        ctx.rotate(angle);
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = Math.min(1, flash.life / 9);
        ctx.fillStyle = 'rgba(255, 227, 94, 0.85)';
        ctx.fillRect(0, -flash.thickness / 2, flash.length, flash.thickness);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.fillRect(0, -1, flash.length * 0.62, 2);
        ctx.fillStyle = 'rgba(255, 102, 55, 0.7)';
        ctx.fillRect(flash.length * 0.58, -flash.thickness, flash.length * 0.35, flash.thickness * 2);
        ctx.restore();

        flash.x += flash.dx;
        flash.y += flash.dy;
        flash.dx *= 0.98;
        flash.dy = flash.dy * 0.98 + 0.18;
        flash.life--;
      });

      smokePuffs.forEach(puff => {
        const alpha = Math.min(0.28, puff.life / 120);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#d7d7d7';
        ctx.beginPath();
        ctx.arc(puff.x, puff.y, puff.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        puff.x += puff.dx;
        puff.y += puff.dy;
        puff.radius += 0.35;
        puff.dx *= 0.97;
        puff.dy *= 0.96;
        puff.life--;
      });

      shellCasings.forEach(shell => {
        ctx.save();
        ctx.translate(shell.x, shell.y);
        ctx.rotate(shell.spin);
        ctx.fillStyle = '#d9a441';
        ctx.fillRect(-3, -1, 7, 3);
        ctx.fillStyle = '#fff1a8';
        ctx.fillRect(2, -1, 2, 3);
        ctx.restore();

        shell.x += shell.dx;
        shell.y += shell.dy;
        shell.dy += 0.45;
        shell.spin += 0.45;
        shell.life--;
      });

      muzzleFlashes = muzzleFlashes.filter(flash =>
        flash.life > 0 &&
        flash.x > -80 &&
        flash.x < canvas.width + 80 &&
        flash.y > -80 &&
        flash.y < canvas.height + 80
      );
      smokePuffs = smokePuffs.filter(puff => puff.life > 0);
      shellCasings = shellCasings.filter(shell => shell.life > 0 && shell.y < canvas.height + 40);
    }

    // --- CONTROLES TECLADO E TOQUE ---
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (!gameRunning) {
          if (assetsReady) resetAndStart();
        } else {
          mj.jump();
        }
      }
      if (e.code === 'KeyE') {
        e.preventDefault();
        useSuper();
      }
      if (e.code === 'KeyH') {
        showHitboxes = !showHitboxes;
      }
      if (e.code === 'ArrowDown') {
        e.preventDefault();
        if (gameRunning) mj.duck(true);
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowDown') {
        if (gameRunning) mj.duck(false);
      }
    });

    canvas.addEventListener('click', () => {
      if (!assetsReady) return;
      if (!gameRunning) {
        resetAndStart();
      } else {
        mj.jump();
      }
    });

    document.getElementById('superBtn').addEventListener('click', () => {
      useSuper();
      document.getElementById('superBtn').blur();
    });

    // --- LÓGICA PRINCIPAL E LOOP ---
    function resetAndStart() {
      gameRunning = true;
      gameOver = false;
      gameSpeed = 6;
      distance = 0;
      score = 0;
      frameCount = 0;
      superCharge = 0;
      superActiveFrames = 0;
      muzzleFlashes = [];
      smokePuffs = [];
      shellCasings = [];
      obstacles = [];
      obstacleDistanceRemaining = randomBetween(300, 420);
      mj.reset();
      document.getElementById('startBtn').blur();
      updateSuperButton();
      playSound('start');
      requestAnimationFrame(gameLoop);
    }

    function checkCollision(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
      sky.addColorStop(0, '#172536');
      sky.addColorStop(0.48, '#536d82');
      sky.addColorStop(1, '#c59b62');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, GROUND_Y);

      const sunX = 660 - (distance * 0.35) % 80;
      const sunGlow = ctx.createRadialGradient(sunX, 38, 2, sunX, 38, 58);
      sunGlow.addColorStop(0, 'rgba(255, 235, 174, 0.85)');
      sunGlow.addColorStop(0.38, 'rgba(255, 207, 119, 0.22)');
      sunGlow.addColorStop(1, 'rgba(255, 207, 119, 0)');
      ctx.fillStyle = sunGlow;
      ctx.beginPath();
      ctx.arc(sunX, 38, 58, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(31, 49, 56, 0.55)';
      const farOffset = -(distance * 0.6) % 220;
      for (let x = farOffset - 220; x < canvas.width + 220; x += 220) {
        ctx.beginPath();
        ctx.moveTo(x, HORIZON_Y);
        ctx.lineTo(x + 52, 58);
        ctx.lineTo(x + 102, HORIZON_Y);
        ctx.lineTo(x + 154, 70);
        ctx.lineTo(x + 220, HORIZON_Y);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = 'rgba(22, 30, 34, 0.72)';
      const skylineOffset = -(distance * 1.15) % 180;
      for (let x = skylineOffset - 180; x < canvas.width + 180; x += 180) {
        ctx.fillRect(x + 12, 92, 24, 44);
        ctx.fillRect(x + 45, 78, 34, 58);
        ctx.fillRect(x + 92, 101, 26, 35);
        ctx.fillRect(x + 132, 86, 38, 50);
      }

      ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
      const cloudOffset = -(distance * 0.38) % 260;
      for (let x = cloudOffset - 260; x < canvas.width + 260; x += 260) {
        ctx.beginPath();
        ctx.ellipse(x + 52, 34, 30, 8, 0, 0, Math.PI * 2);
        ctx.ellipse(x + 84, 31, 24, 7, 0, 0, Math.PI * 2);
        ctx.ellipse(x + 116, 36, 34, 8, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawGround() {
      const ground = ctx.createLinearGradient(0, GROUND_Y, 0, canvas.height);
      ground.addColorStop(0, '#40372f');
      ground.addColorStop(0.42, '#27221f');
      ground.addColorStop(1, '#101112');
      ctx.fillStyle = ground;
      ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

      ctx.strokeStyle = 'rgba(255, 226, 139, 0.45)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y + 1);
      ctx.lineTo(canvas.width, GROUND_Y + 1);
      ctx.stroke();

      const roadOffset = -(distance * 18) % 48;
      ctx.fillStyle = 'rgba(205, 184, 130, 0.35)';
      for (let x = roadOffset - 48; x < canvas.width; x += 48) {
        ctx.fillRect(x, GROUND_Y + 19, 24, 2);
      }

      ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
      for (let i = 0; i < 70; i++) {
        const x = (i * 37 - distance * 22) % canvas.width;
        const y = GROUND_Y + 5 + (i * 11) % 28;
        ctx.fillRect(x < 0 ? x + canvas.width : x, y, 2, 1);
      }
    }

    function drawEntityShadow(x, y, width, alpha = 0.28) {
      ctx.save();
      ctx.fillStyle = `rgba(0, 0, 0, ${alpha})`;
      ctx.beginPath();
      ctx.ellipse(x + width / 2, GROUND_Y + 2, Math.max(12, width * 0.45), 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawObstacle(obs) {
      ctx.save();
      const previousSmoothing = ctx.imageSmoothingEnabled;
      ctx.imageSmoothingEnabled = true;

      if (obs.type === 'airplane') {
        ctx.filter = 'brightness(0.95) contrast(1.05) saturate(0.92)';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.28)';
        ctx.shadowBlur = 4;
        ctx.shadowOffsetY = 2;
        ctx.drawImage(imgAirplane, obs.x, obs.y, obs.width, obs.height);
      } else if (obs.type === 'tower') {
        drawEntityShadow(obs.x, obs.y, obs.width, 0.22);
        ctx.filter = 'brightness(0.86) contrast(1.12) saturate(0.9)';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
        ctx.shadowBlur = 3;
        ctx.shadowOffsetY = 1;
        ctx.drawImage(imgTower, obs.x, obs.y, obs.width, obs.height);
      }

      ctx.imageSmoothingEnabled = previousSmoothing;
      ctx.filter = 'none';
      ctx.restore();
    }

    function drawHitBox(box) {
      ctx.save();
      ctx.strokeStyle = DEBUG_HITBOX_COLOR;
      ctx.lineWidth = 1;
      ctx.strokeRect(box.x, box.y, box.width, box.height);
      ctx.restore();
    }

    function drawHud() {
      const padScore = (num) => String(num).padStart(5, '0');
      ctx.save();
      ctx.fillStyle = 'rgba(8, 10, 13, 0.72)';
      ctx.fillRect(12, 10, 150, 40);
      ctx.fillRect(508, 10, 280, 32);

      ctx.font = '12px "Press Start 2P"';
      ctx.fillStyle = '#f4d35e';
      ctx.fillText(`HI ${padScore(highScore)}  ${padScore(score)}`, 520, 30);

      const superRatio = superActiveFrames > 0
        ? superActiveFrames / SUPER_DURATION_FRAMES
        : Math.min(1, superCharge / SUPER_CHARGE_FRAMES);
      ctx.fillStyle = '#2a2d31';
      ctx.fillRect(20, 18, 130, 10);
      ctx.fillStyle = superActiveFrames > 0 ? '#d84a3a' : '#f4d35e';
      ctx.fillRect(20, 18, 130 * superRatio, 10);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.strokeRect(20, 18, 130, 10);
      ctx.font = '8px "Press Start 2P"';
      ctx.fillStyle = '#f5f2e8';
      ctx.fillText(superActiveFrames > 0 ? 'SUPER ATIVO' : 'SUPER', 20, 42);
      ctx.restore();
    }

    function renderScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();
      drawGround();

      obstacles.forEach(drawObstacle);
      drawEntityShadow(mj.x, mj.y, mj.width, mj.isJumping ? 0.14 : 0.26);
      mj.draw(ctx, frameCount);
      drawSuperShot();

      if (showHitboxes) {
        drawHitBox(mj.getBox());
        obstacles.forEach(obs => drawHitBox(getObstacleBox(obs)));
      }

      drawHud();
    }

    function gameLoop() {
      if (!gameRunning) return;

      frameCount++;
      distance += gameSpeed * 0.025;
      const newScore = Math.floor(distance);

      if (superActiveFrames > 0) {
        superActiveFrames--;
        obstacles = [];
      } else if (superCharge < SUPER_CHARGE_FRAMES) {
        superCharge++;
      }

      if (frameCount % 10 === 0 || superActiveFrames === SUPER_DURATION_FRAMES - 1) {
        updateSuperButton();
      }

      if (newScore > score) {
        score = newScore;
        if (score > 0 && score % 100 === 0) playSound('score');
      }

      gameSpeed = Math.min(13, 6 + score * 0.005);
      mj.update();

      // Gerencia Obstáculos
      obstacleDistanceRemaining -= gameSpeed;
      if (obstacleDistanceRemaining <= 0) {
        spawnObstacle();
        obstacleDistanceRemaining = getNextObstacleGap();
      }

      for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        obs.x -= gameSpeed;

        if (obs.type === 'airplane') {
          obs.y = obs.baseY + Math.sin(frameCount / 20 + obs.phase) * 2;
        }

        const mjBox = mj.getBox();
        const obsBox = getObstacleBox(obs);

        if (checkCollision(mjBox, obsBox)) {
          triggerGameOver();
          return;
        }
      }

      obstacles = obstacles.filter(obs => obs.x > -100);

      renderScene();
      requestAnimationFrame(gameLoop);
    }

    function triggerGameOver() {
      gameRunning = false;
      gameOver = true;
      updateSuperButton();
      playSound('hit');

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('mj_hi', highScore);
      }

      renderScene();

      // Redesenha chão e jogo congelado
      ctx.font = '16px "Press Start 2P"';
      ctx.fillStyle = 'rgba(6, 7, 8, 0.68)';
      ctx.fillRect(206, 56, 388, 76);
      ctx.fillStyle = '#e74c3c';
      ctx.textAlign = 'center';
      ctx.fillText('G A M E   O V E R', canvas.width / 2, 80);

      ctx.font = '10px "Press Start 2P"';
      ctx.fillStyle = '#f4d35e';
      ctx.fillText('PRESSIONE ESPAÇO PARA JOGAR', canvas.width / 2, 115);
      ctx.textAlign = 'left';
    }
  </script>
